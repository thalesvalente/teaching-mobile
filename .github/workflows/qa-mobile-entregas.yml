name: QA Mobile — Entregas Aula 07

on:
  push:
    branches:
      - feat/mobile-aula07-entregas-sheets-20261021
      - main
    paths:
      - 'lessons/aula-07-estado-filtros/**'
      - 'tests/mobile-*.cjs'
      - 'tests/pontuacao-aulas.test.cjs'
      - 'tests/avaliador-projeto.test.mjs'
      - '.github/workflows/qa-mobile-entregas.yml'
  pull_request:
    paths:
      - 'lessons/aula-07-estado-filtros/**'
      - 'tests/mobile-*.cjs'
      - 'tests/pontuacao-aulas.test.cjs'
      - 'tests/avaliador-projeto.test.mjs'
      - '.github/workflows/qa-mobile-entregas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motor-e-invariantes:
    name: Servidor, rubrica original e regressões
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contratos da Aula 06/07 e avaliador Expo
        run: node --test tests/pontuacao-aulas.test.cjs tests/avaliador-projeto.test.mjs
      - name: Integridade didática e Apps Script simulado
        run: node --test tests/mobile-entregas.test.cjs
      - name: Diagnóstico HTTP GET do Apps Script Mobile (sem dados)
        env:
          MOBILE_EXEC_URL: https://script.google.com/macros/s/AKfycbyrvOlCl0Icm98SRNJ3SJy4gjx4Q4GH_k0EhxV50ebe93JXj_zjE8MmJ_zoGMwvNtXR/exec
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --location --silent --show-error --connect-timeout 10 --max-time 35 --output /tmp/mobile-get-response --write-out '%{http_code}' "$MOBILE_EXEC_URL")"
          echo "GET status HTTP: $status"
          python3 - <<'PY'
          import pathlib, re, html, sys
          body = pathlib.Path('/tmp/mobile-get-response').read_text(encoding='utf-8', errors='replace')
          expected = 'Mobile — endpoint de entrega ativo. Versão: mobile-entregas-1.0.0'
          if expected in body:
              print('PASS: GET Mobile versão 1.0.0, sem envio de dados')
          else:
              titles = re.findall(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
              title = html.unescape(re.sub(r'<[^>]*>',' ',titles[0]))[:130] if titles else '(sem título HTML)'
              preview = re.sub(r'\s+',' ',body[:180])
              preview = re.sub(r'[\w.+-]+@[\w.-]+','[email oculto]',preview)
              print(f'GET inesperado: bytes={len(body)}; título={title}; início={preview}')
              sys.exit(1)
          PY

  navegador:
    name: Ficha Chromium — PDF, hash e recibo simulado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências do QA
        run: npm install --no-save --no-package-lock playwright@1.57.0 axe-core@4.10.3
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E real de PDF com endpoint HTTP simulado
        run: node tests/mobile-entrega-browser.cjs
